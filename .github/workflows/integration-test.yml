name: integration-test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One in-flight run per PR. A new push cancels the previous run so we never
# spend a Kind cluster on a commit that has already been superseded.
concurrency:
  group: integration-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter: the heavy test is only meaningful for changes to the deployable
  # surface. On a docs/CI-only PR the integration-test job below is skipped, and a
  # skipped required check counts as a pass — exactly what we want.
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      # Underscore, not a hyphen. GitHub documents hyphenated context property
      # names as working, but nothing else in this repo proves it, and the
      # failure mode if it did not would be silent: the expression evaluates to
      # the empty string, the job's `if` is false, and platform-lint is skipped
      # forever with no error anywhere.
      platform_python: ${{ steps.filter.outputs.platform_python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # A second, narrower filter for platform-lint below. Deliberately
            # NOT folded into `relevant`: a ruff-config edit should not spin up
            # a Kind cluster, and `relevant` gates the heavy required job.
            #
            # The root pyproject.toml is in here because it is where the rule
            # set for these two directories is declared — edit the select list
            # and nothing else, and without this entry nothing would check the
            # result.
            platform_python:
              - 'scripts/**'
              - 'tests/**'
              - 'pyproject.toml'
              - '.github/workflows/integration-test.yml'
            relevant:
              - 'services/**'
              # The shared collector library — auth, the five routes, the
              # capture loop, the lake writer, the envelope. A PR touching
              # only libs/ used to skip this job entirely, and a skipped
              # required check counts as a pass.
              - 'libs/**'
              - 'helm/**'
              - 'infra/**'
              - 'scripts/**'
              # Without this, a PR editing only the platform tests skips the very
              # job that runs them — including the OTel-DNS guard test itself.
              - 'tests/**'
              - 'contracts/**'
              # chaos/ is a new top-level directory. Without an entry here a
              # chaos-only PR skips integration-test, and a skipped required
              # check counts as a pass. contracts/ once triggered no CI at all
              # for exactly this reason.
              - 'chaos/**'

  # `scripts/` and repo-root `tests/` are the only Python in the repo that is
  # not inside a package, and until this job existed nothing linted them:
  # .github/actions/python-lint is only ever invoked with `working-directory`
  # pointing at a service root or at libs/collector-core. That gap is issue #76,
  # and it was not cosmetic — scripts/collectors.py, scripts/new-collector.py,
  # scripts/refresh-collector.py and scripts/check-registry.py are the tooling
  # every collector's onboarding runs through, and tests/ holds the drift gates.
  #
  # It cannot reuse .github/actions/python-lint: that action runs
  # `uv sync --frozen` in the working directory, and neither of these two
  # directories is a package with a pyproject.toml and a dev group to sync.
  # `uv run --no-project` is the form the rest of the repo already uses for
  # exactly this (see the integration-test job below, and CLAUDE.md's
  # Local Stack section).
  #
  # The ruff version is pinned rather than floating: an unpinned `--with ruff`
  # means a new release can red a PR that changed nothing, which is how a lint
  # gate earns a reputation for being ignorable. 0.16.0 is what the root
  # uv.lock already resolves for every service's dev group, so this job and the
  # per-service `lint` legs in services.yml apply the same ruff.
  #
  # The rule set itself lives in the root pyproject.toml's [tool.ruff], not
  # here, so `ruff check scripts/ tests/` run locally gives the same answer.
  platform-lint:
    needs: changes
    if: needs.changes.outputs.platform_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint
        run: uv run --no-project --with ruff==0.16.0 ruff check scripts/ tests/
      - name: Format check
        run: uv run --no-project --with ruff==0.16.0 ruff format --check scripts/ tests/

  # Repo-root tests/ cover platform concerns that no per-service suite can see —
  # rollback, Argo CD deploy manifests, and the OTel collector DNS name rendered
  # by the Helm chart. Nothing ran them before; they need helm on PATH but no
  # cluster, so they sit beside the heavy job rather than inside it.
  platform-tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with:
          # The input is `version`, not `helm-version` — v5 ignores unknown
          # inputs with only a warning, so a typo here silently installs latest.
          version: "v3.17.3"
      - name: Verify helm is available
        run: helm version
      - uses: astral-sh/setup-uv@v5
      - name: Run platform tests
        run: uv run --with pyyaml==6.0.3 --with pytest==9.0.3 --with jsonschema==4.26.0 pytest tests/ -q

  integration-test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/kakhavai/foundry/ci-runner:latest
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Create Kind cluster
        run: kind create cluster --config infra/kind/cluster.yaml --name foundry

      - name: Fix kubeconfig for container networking
        run: |
          # GHA container jobs run on a 'github_network_*' bridge; Kind nodes are on the
          # 'kind' network. Instead of connecting this container to Kind (requires knowing
          # our own container ID, unreliable on cgroup v2), connect the Kind control-plane
          # node to our network — no self-ID needed.
          GHA_NETWORK=$(docker network ls --format '{{.Name}}' | grep 'github_network' | head -1)
          docker network connect "$GHA_NETWORK" foundry-control-plane
          NODE_IP=$(docker inspect foundry-control-plane \
            --format="{{(index .NetworkSettings.Networks \"$GHA_NETWORK\").IPAddress}}")
          # --insecure-skip-tls-verify: Kind's cert SANs only include the Kind-network IP
          # (172.19.x.x), not the GHA-network IP we're now connecting through.
          kubectl config set-cluster kind-foundry \
            --server="https://$NODE_IP:6443" \
            --insecure-skip-tls-verify=true

      - name: Deploy observability stack
        run: |
          cd infra/grafana-stack
          helmfile repos
          helmfile apply

      # The collector that publishes the fleet's scope lists ships
      # CAPTURE_ENABLED=false (its upstream is a ~37 MB weekly document, and
      # this cluster is rebuilt on every run — see that collector's own Helm
      # values), so no scope envelope ever reaches the lake here unless
      # something else writes one. That matters because every OTHER
      # collector's capture loop runs its first pass immediately at pod
      # startup, before its first scheduled sleep (see
      # collector_core.scheduler.run_capture_loop) — so whichever narrowed
      # collector captures automatically in CI reads whatever scope exists
      # (or doesn't) at the moment ITS pod starts in "Deploy services" below,
      # not at whatever moment this workflow happens to seed one. This step
      # must therefore run BEFORE "Deploy services", not after — an earlier
      # version of this file ran it between "Wait for pods ready" and "Smoke
      # test services", which seeded the lake only after every narrowed
      # collector had already taken its one automatic capture and found
      # nothing, making the seed a no-op.
      #
      # Two of the narrowed collectors ship CAPTURE_ENABLED=false themselves
      # in CI and never capture at all regardless of ordering (same load
      # reasoning as above). Of the one that does capture automatically, its
      # own player ids are minted independently of this fixture's (a
      # documented gap — see scripts/seed-scope-fixture.py's docstring), so
      # seeding this BEFORE its pod starts gets it onto the `fetch_union`
      # success path — publishing its team-keyed signal unfiltered and its
      # player-keyed signal narrowed to empty — rather than the
      # `ScopeUnavailable` / `scope_unavailable` failure path. That is real,
      # if partial, coverage of the narrowing code path, not full coverage of
      # narrowing actually filtering rows.
      #
      # Rejected alternatives: enabling that collector's real capture in CI
      # (pulls a real ~37 MB document on every push), and having this step —
      # or the smoke test — POST /refresh (a dispatched refresh reaches the
      # real upstream regardless of CAPTURE_ENABLED, which is exactly why its
      # own values file says the smoke test must not).
      #
      # No collector is named in this comment on purpose —
      # tests/test_collector_tooling.py's
      # test_no_collector_name_is_hardcoded_in_the_tooling fails this file if
      # one is; see that test's docstring for why.
      - name: Seed a scope fixture into the lake
        run: |
          # helmfile's `wait: true` (infra/grafana-stack/helmfile.yaml)
          # already blocks "Deploy observability stack" above until every
          # release there, MinIO included, is Ready. This wait is a second,
          # explicit check rather than relying on that alone — the same
          # `kubectl wait` "Wait for pods ready" uses further down — so a
          # future change to helmfile's own defaults can't silently turn this
          # step's ordering fix into the same rely-on-something-implicit bug
          # it exists to close.
          kubectl wait --for=condition=ready pod \
            --all -n monitoring --timeout=180s

          # MinIO's in-cluster DNS name (what every collector's own
          # LAKE_ENDPOINT_URL points at) is not reachable directly from this
          # container: it sits on the cluster's pod network, and this
          # container is only bridged to the Kind control-plane node's own
          # network interface (see "Fix kubeconfig for container networking"
          # above). kubectl port-forward tunnels through the API server
          # instead, the same way scripts/smoke-test.sh reaches every
          # in-cluster service from this same container.
          kubectl port-forward -n monitoring svc/minio 9000:9000 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT

          # Wait on the tunnel being USABLE, not on a guess at how long it
          # takes to come up. Everything else in this file waits on a
          # condition; a fixed sleep here meant a slow port-forward refused
          # the boto3 write below and turned the REQUIRED integration-test
          # check red for a reason that has nothing to do with the diff.
          #
          # MinIO's liveness endpoint needs no credentials and no bucket, so
          # a 200 from it means exactly "the tunnel carries HTTP to MinIO" —
          # which is the only thing this step needs to know before writing.
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null --max-time 2 \
                 http://localhost:9000/minio/health/live; then
              echo "MinIO reachable through the port-forward after ${attempt}s"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "MinIO did not answer through the port-forward within 30s" >&2
              exit 1
            fi
            sleep 1
          done

          # Credentials match scripts/deploy-local.py's LOCAL_LAKE_ACCESS_KEY /
          # LOCAL_LAKE_SECRET_KEY — the same values infra/grafana-stack/values/
          # minio.yaml's rootUser/rootPassword seed MinIO with. Kind-only,
          # committed deliberately, same as the collector bearer token.
          #
          # --with ./libs/collector-core, not --with boto3 alone: the script
          # builds its envelopes through collector_core.envelope and writes
          # them through collector_core.lake rather than a second, hand-rolled
          # implementation of either, and collector-core already declares
          # boto3 as its own runtime dependency, so this pulls both in.
          #
          # --python 3.12 is REQUIRED, and its absence is not a style slip.
          # The ci-runner image's ambient python3 is 3.10, `--no-project`
          # means uv resolves against that ambient interpreter rather than
          # the workspace's, and collector-core declares
          # `requires-python = ">=3.12"`. Without the pin uv fails at
          # RESOLUTION with "the current Python version (3.10.12) does not
          # satisfy Python>=3.12", before the script is ever imported — a
          # red REQUIRED check whose message points at collector-core rather
          # than at this line. The neighbouring --no-project steps need no
          # pin only because ruff and pyyaml still support 3.10.
          LAKE_BUCKET=foundry-signals \
          LAKE_ENDPOINT_URL=http://localhost:9000 \
          AWS_ACCESS_KEY_ID=foundry \
          AWS_SECRET_ACCESS_KEY=foundry-local-dev \
          AWS_DEFAULT_REGION=us-east-1 \
          uv run --no-project --python 3.12 --with ./libs/collector-core python3 \
            scripts/seed-scope-fixture.py --season 2026 --week 1 --lake

      - name: Deploy collector gateway
        run: |
          cd infra/gateway
          helmfile apply
          cd ../..
          kubectl apply -f infra/gateway/manifests/
          kubectl wait --for=condition=Programmed gateway/foundry \
            -n envoy-gateway-system --timeout=180s

      # Both of the steps below derive their service list from
      # contracts/collector-registry.yaml plus each service's Helm values, via
      # scripts/collectors.py. They used to be two hand-maintained lists that
      # had to be kept in step with each other, with deploy-local.py, with
      # stack-up.py and with smoke-test.sh; a collector missing from the second
      # list is deployed but never waited for, and the smoke test then fails
      # against a pod that simply was not ready yet.
      #
      # `uv run --no-project --with pyyaml`: the ci-runner image ships a bare
      # python3 with no PyYAML, and --no-project keeps uv from building the
      # whole workspace to run a script that imports none of it.
      - name: Deploy services
        run: |
          for svc in $(uv run --no-project --with pyyaml==6.0.3 \
              python3 scripts/collectors.py --names); do
            uv run --no-project --with pyyaml==6.0.3 \
              python3 scripts/deploy-local.py "$svc"
          done

      - name: Wait for pods ready
        run: |
          kubectl wait --for=condition=ready pod \
            --all -n monitoring --timeout=180s
          kubectl wait --for=condition=ready pod \
            -n envoy-gateway-system --all --timeout=180s
          # `rollout status`, not `wait --for=condition=ready pod -l <label>`:
          # the label selector also matches pods left Terminating by a rollout,
          # which never reach Ready, so the wait times out on a Deployment that
          # is in fact healthy.
          for svc in $(uv run --no-project --with pyyaml==6.0.3 \
              python3 scripts/collectors.py --names); do
            kubectl rollout status "deployment/$svc" --timeout=120s
          done

      - name: Smoke test services
        run: bash scripts/smoke-test.sh

      # Runs only when something above failed, and never fails the job itself.
      # Without it a rollout timeout reports "0 of 1 updated replicas are
      # available" and nothing else — no pod phase, no container state, no
      # logs, no events — so the single most common integration failure is
      # also the one the log tells you least about. Diagnosing it otherwise
      # costs a full push/wait cycle per hypothesis.
      - name: Diagnose failure
        if: failure()
        run: |
          echo "::group::pods"
          kubectl get pods -A -o wide || true
          echo "::endgroup::"
          echo "::group::describe non-running pods"
          kubectl get pods -A --no-headers 2>/dev/null \
            | awk '$4 != "Running" && $4 != "Completed" {print $1, $2}' \
            | while read -r ns pod; do
                echo "--- describe $ns/$pod"
                kubectl describe pod -n "$ns" "$pod" || true
              done
          echo "::endgroup::"
          echo "::group::logs (current and previous) for default namespace"
          for pod in $(kubectl get pods -n default -o name 2>/dev/null); do
            echo "--- logs $pod"
            kubectl logs -n default "$pod" --tail=120 --all-containers || true
            echo "--- previous logs $pod (empty unless it restarted)"
            kubectl logs -n default "$pod" --tail=120 --all-containers -p || true
          done
          echo "::endgroup::"
          echo "::group::recent events"
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          echo "::endgroup::"

      - name: Tear down cluster
        if: always()
        run: kind delete cluster --name foundry
