name: ci-runner

on:
  push:
    branches:
      - main
    paths:
      - 'infra/ci/Dockerfile'

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: infra/ci
          push: true
          tags: ghcr.io/kakhavai/foundry/ci-runner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
