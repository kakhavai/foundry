name: player-projections

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    paths:
      - 'services/player-projections/**'
      - 'helm/values/player-projections/**'
      - 'helm/charts/generic-service/**'
      - '.github/actions/**'
  push:
    branches:
      - main
    paths:
      - 'services/player-projections/**'
      - 'helm/values/player-projections/**'
      - 'helm/charts/generic-service/**'
      - '.github/actions/**'

# Cancel superseded PR runs; serialize (never cancel) main pushes so an in-flight
# build-push / update-gitops-tag deploy is not killed mid-commit.
concurrency:
  group: player-projections-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-lint
        with:
          working-directory: services/player-projections

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-test
        with:
          working-directory: services/player-projections

  helm-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/helm-lint
        with:
          chart-path: helm/charts/generic-service
          values-file: helm/values/player-projections/values.yaml

  build-push:
    runs-on: ubuntu-latest
    needs: [lint, test, helm-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-push
        with:
          service: player-projections
          image-name: ghcr.io/kakhavai/foundry/player-projections
          tag: ${{ github.sha }}

  update-gitops-tag:
    runs-on: ubuntu-latest
    needs: [build-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./.github/actions/update-gitops-tag
        with:
          service: player-projections
          tag: ${{ github.sha }}
