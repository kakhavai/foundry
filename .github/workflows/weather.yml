name: weather

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    paths:
      - 'services/weather/**'
      - 'libs/**'
      - 'helm/values/weather/**'
      - 'helm/charts/generic-service/**'
      - '.github/actions/**'
      - 'contracts/**'
  push:
    branches:
      - main
    paths:
      - 'services/weather/**'
      - 'libs/**'
      - 'helm/values/weather/**'
      - 'helm/charts/generic-service/**'
      - '.github/actions/**'
      - 'contracts/**'

# Cancel superseded PR runs; serialize (never cancel) main pushes so an in-flight
# build-push / update-gitops-tag deploy is not killed mid-commit.
concurrency:
  group: weather-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-lint
        with:
          working-directory: services/weather

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-test
        with:
          working-directory: services/weather

  helm-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/helm-lint
        with:
          chart-path: helm/charts/generic-service
          values-file: helm/values/weather/values.yaml

  collector-core-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-lint
        with:
          working-directory: libs/collector-core

  collector-core-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-test
        with:
          working-directory: libs/collector-core
      - name: Every library module must import with runtime deps only
        shell: bash
        working-directory: libs/collector-core
        run: |
          uv sync --frozen --no-dev
          uv run --no-sync python - <<'PY'
          import importlib, pkgutil, sys
          import collector_core
          failed = []
          for m in pkgutil.iter_modules(collector_core.__path__):
              name = f"collector_core.{m.name}"
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failed.append(f"{name}: {exc!r}")
          if failed:
              print("Modules that fail to import without dev dependencies:")
              for f in failed:
                  print("  ", f)
              sys.exit(1)
          print("all modules import with runtime dependencies only")
          PY

  build-push:
    runs-on: ubuntu-latest
    needs: [lint, test, helm-lint, collector-core-lint, collector-core-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-push
        with:
          service: weather
          context: .
          dockerfile: services/weather/Dockerfile
          image-name: ghcr.io/kakhavai/foundry/weather
          tag: ${{ github.sha }}

  update-gitops-tag:
    runs-on: ubuntu-latest
    needs: [build-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./.github/actions/update-gitops-tag
        with:
          service: weather
          tag: ${{ github.sha }}
