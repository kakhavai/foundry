name: weather

on:
  pull_request:
    paths:
      - 'services/weather/**'
      - 'helm/values/weather/**'
      - 'helm/charts/generic-service/**'
      - '.github/actions/**'
  push:
    branches:
      - main
    paths:
      - 'services/weather/**'
      - 'helm/values/weather/**'
      - 'helm/charts/generic-service/**'
      - '.github/actions/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-lint
        with:
          working-directory: services/weather

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-test
        with:
          working-directory: services/weather

  helm-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/helm-lint
        with:
          chart-path: helm/charts/generic-service
          values-file: helm/values/weather/values.yaml

  build-push:
    runs-on: ubuntu-latest
    needs: [lint, test, helm-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-push
        with:
          service: weather
          image-name: ghcr.io/kakhavai/foundry/weather
          tag: ${{ github.sha }}

  update-gitops-tag:
    runs-on: ubuntu-latest
    needs: [build-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./.github/actions/update-gitops-tag
        with:
          service: weather
          tag: ${{ github.sha }}
