name: Python test
description: Runs pytest for a Python service using uv

inputs:
  working-directory:
    required: true
    description: Path to the Python service root relative to repo root (e.g. services/weather)

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v5
    - name: Install dependencies
      shell: bash
      run: uv sync --frozen
      working-directory: ${{ inputs.working-directory }}
    - name: Check lockfile is current
      shell: bash
      run: uv lock --check
      working-directory: ${{ inputs.working-directory }}
    - name: Test
      shell: bash
      run: uv run pytest
      working-directory: ${{ inputs.working-directory }}
    - name: Coverage summary
      if: always()
      shell: bash
      run: |
        echo "### Coverage — ${{ inputs.working-directory }}" >> "$GITHUB_STEP_SUMMARY"
        uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      working-directory: ${{ inputs.working-directory }}
