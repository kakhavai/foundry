name: Update GitOps image tag
description: >
  Writes a new image tag to infra/gitops/envs/local/<service>/values.yaml
  and commits + pushes to the current branch. Requires contents:write permission.

inputs:
  service:
    required: true
    description: "Service name matching a directory in infra/gitops/envs/local/ (e.g. weather)"
  tag:
    required: true
    description: "Image tag to write (e.g. the Git SHA from github.sha)"
  token:
    required: true
    description: "PAT with contents:write — must be a repo admin to bypass branch protection"

runs:
  using: composite
  steps:
    - name: Write new image tag
      shell: bash
      run: |
        cat > infra/gitops/envs/local/${{ inputs.service }}/values.yaml << 'EOF'
        image:
          tag: "${{ inputs.tag }}"
        EOF

    - name: Commit and push
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${{ inputs.token }}@github.com/${{ github.repository }}
        git add infra/gitops/envs/local/${{ inputs.service }}/values.yaml
        git diff --cached --quiet && echo "No tag change, skipping commit" && exit 0
        git commit -m "chore(gitops): update ${{ inputs.service }} image tag to ${{ inputs.tag }}"
        git push
