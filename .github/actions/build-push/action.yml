name: Build and push image
description: Builds a service image and pushes it to GHCR

inputs:
  service:
    required: true
    description: Service name, used as the build context path (e.g. weather)
  image-name:
    required: true
    description: Full image name including registry (e.g. ghcr.io/owner/repo/service)
  tag:
    required: true
    description: Image tag (e.g. the Git SHA)
  context:
    required: false
    default: ''
    description: >-
      Docker build context. Defaults to services/<service>. Collectors that
      depend on the libs/collector-core workspace member must pass '.' so the
      library is inside the context.
  dockerfile:
    required: false
    default: ''
    description: >-
      Dockerfile path. Defaults to <context>/Dockerfile. Collectors pass
      'Dockerfile.collector' — one file builds the whole fleet.
  build-args:
    required: false
    default: ''
    description: >-
      Newline-separated NAME=VALUE build args. Collectors pass
      SERVICE/PACKAGE/PORT, which is what makes one Dockerfile serve the fleet.
      Deliberately empty for a non-collector: its Dockerfile declares no ARGs,
      and passing them anyway makes BuildKit warn on every build. Computed by
      .github/actions/changed-services/filters.py, never written by hand.

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context || format('services/{0}', inputs.service) }}
        file: ${{ inputs.dockerfile || format('services/{0}/Dockerfile', inputs.service) }}
        build-args: ${{ inputs.build-args }}
        push: true
        tags: ${{ inputs.image-name }}:${{ inputs.tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
