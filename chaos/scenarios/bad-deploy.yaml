apiVersion: foundry.chaos/v1
kind: Scenario
metadata:
  name: bad-deploy
spec:
  steadyState:
    - description: weather has no unavailable replicas
      query: max(kube_deployment_status_replicas_unavailable{deployment="weather"})
      expect: "== 0"
    - description: weather is up
      query: up{job="weather"}
      expect: "== 1"
  hypothesis: >
    Argo CD detects the drift from the manifest and reverts the image. The bad
    ReplicaSet never becomes available and weather never stops serving.
  # Longer than the other scenarios: this gives Argo's reconcile loop room
  # rather than making the criterion a race against it.
  duration: 30s
  settle: 180s
  fault:
    - ["kubectl", "set", "image", "deployment/weather",
       "weather=ghcr.io/kakhavai/foundry/weather:does-not-exist", "-n", "default"]
  restore:
    # A safety net only. On the passing path Argo has already reverted this.
    - ["kubectl", "rollout", "undo", "deployment/weather", "-n", "default"]
  criteria:
    - description: the drift was reverted and no replica is unavailable
      query: max(kube_deployment_status_replicas_unavailable{deployment="weather"})
      expect: "== 0"
    - description: weather never stopped serving
      query: min_over_time(up{job="weather"}[5m])
      expect: "== 1"
