apiVersion: foundry.chaos/v1
kind: Scenario
metadata:
  name: resource-pressure
spec:
  steadyState:
    - description: weather is well under its memory limit
      query: (max(container_memory_working_set_bytes{namespace="default",container="weather"}) / max(container_spec_memory_limit_bytes{namespace="default",container="weather"}))
      expect: "< 0.5"
    - description: player-projections is up
      query: up{job="player-projections"}
      expect: "== 1"
  hypothesis: >
    Sustained memory pressure holds weather's cgroup near its limit without
    breaching it. The cgroup contains the pressure inside weather's own
    container: it does not consume node memory, player-projections on the
    same node is untouched, and weather keeps serving throughout. This
    scenario does not exercise an OOM kill — that failure path is real, but
    it resolves in under a second, which is invisible at this cluster's 60s
    metrics scrape resolution.
  duration: 180s
  settle: 60s
  criteria:
    # "the limit held" is on its own a criterion the kernel guarantees — it is
    # true whether or not any stress ran. It is paired with "the stress was
    # real", which is the half that can go red. The pairing is the pattern.
    - description: the stress actually pressed against the limit
      query: max_over_time((max(container_memory_working_set_bytes{namespace="default",container="weather"}) / max(container_spec_memory_limit_bytes{namespace="default",container="weather"}))[5m:15s])
      expect: "> 0.85"
    - description: the limit held
      query: max_over_time((max(container_memory_working_set_bytes{namespace="default",container="weather"}) / max(container_spec_memory_limit_bytes{namespace="default",container="weather"}))[5m:15s])
      expect: "<= 1.05"
    - description: blast radius stayed inside weather's container
      query: min_over_time(up{job="player-projections"}[5m])
      expect: "== 1"
    - description: weather recovered
      query: up{job="weather"}
      expect: "== 1"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: chaos-memory-weather
  namespace: default
spec:
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app.kubernetes.io/name: weather
  stressors:
    memory:
      workers: 1
      # 49MiB idle + 190MB ≈ 239MiB of the 256Mi limit ≈ 0.93 — high enough
      # to press hard and sustain it for the whole window, but low enough
      # that the OOM killer never fires and the container survives.
      size: 190MB
  duration: 180s
