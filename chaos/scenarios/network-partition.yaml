apiVersion: foundry.chaos/v1
kind: Scenario
metadata:
  name: network-partition
spec:
  steadyState:
    - description: the gateway sees weather as a healthy upstream
      query: max(envoy_cluster_membership_healthy{envoy_cluster_name="httproute/default/weather/rule/0"})
      expect: "== 1"
    # Residue guard, and it is load-bearing. The criterion below looks back
    # [5m], so a run started too soon after a previous one inherits its
    # predecessor's connect-fail spike and PASSES without having broken
    # anything — a green result proving nothing, which is the failure this
    # whole directory exists to prevent. Observed for real: a deliberately
    # neutered run scored 6.15 purely on the prior run's residue.
    # [2m] rather than [5m] so a re-run is merely delayed, not blocked.
    # No allowEmpty here, unlike latency-injection: this series always exists
    # (it reads 0 on a healthy gateway), so an empty result means the Envoy
    # metrics are genuinely missing and aborting is the right response.
    - description: no recent gateway connection failures
      query: increase(max(envoy_cluster_upstream_cx_connect_fail{envoy_cluster_name="httproute/default/weather/rule/0"})[2m:15s])
      expect: "== 0"
    - description: weather is up
      query: up{job="weather"}
      expect: "== 1"
  hypothesis: >
    Partitioning the Envoy data plane from weather costs the gateway its
    upstream while weather itself stays healthy. The failure is at the edge, not
    in the service — two distinct blast radii, and Prometheus scrapes weather
    directly rather than through the gateway, so it can tell them apart.
  traffic: gateway
  duration: 90s
  settle: 30s
  criteria:
    - description: the gateway failed to connect to its upstream
      query: increase(max(envoy_cluster_upstream_cx_connect_fail{envoy_cluster_name="httproute/default/weather/rule/0"})[5m:15s])
      expect: "> 0"
    - description: weather itself was never affected
      query: min_over_time(up{job="weather"}[5m])
      expect: "== 1"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: chaos-partition-gateway-weather
  namespace: envoy-gateway-system
spec:
  action: partition
  mode: all
  # The data-plane Deployment name carries a generated hash, so it is selected
  # by the label Envoy Gateway stamps on it, never hardcoded.
  selector:
    namespaces:
      - envoy-gateway-system
    labelSelectors:
      gateway.envoyproxy.io/owning-gateway-name: foundry
  direction: both
  target:
    mode: all
    selector:
      namespaces:
        - default
      labelSelectors:
        app.kubernetes.io/name: weather
  duration: 90s
