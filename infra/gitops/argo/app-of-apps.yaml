apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foundry-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://github.com/kakhavai/foundry
    targetRevision: main
    path: infra/gitops/argo
    directory:
      recurse: false
      exclude: app-of-apps.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
