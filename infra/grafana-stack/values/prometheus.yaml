alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

# Required by chaos/scenarios/bad-deploy.yaml. With replicaCount 1 and the
# default rolling update, maxUnavailable resolves to 0, so the old pod keeps
# serving whether or not Argo's selfHeal reverts a bad image — every
# continuity-based criterion passes either way. kube_deployment_status_replicas_unavailable
# is the only signal that separates the two, so without this the scenario
# cannot fail.
kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: false

server:
  retention: 24h

extraScrapeConfigs: |
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:8889
  - job_name: weather
    static_configs:
      - targets:
          - weather.default.svc.cluster.local:8000
  - job_name: player-projections
    static_configs:
      - targets:
          - player-projections.default.svc.cluster.local:8001
