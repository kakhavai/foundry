{{- if .Values.gateway.enabled }}
{{- if not .Values.gateway.pathPrefix }}
{{- fail "gateway.pathPrefix must be set when gateway.enabled is true (e.g. /collectors/weather)" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "generic-service.fullname" . }}
  labels:
    {{- include "generic-service.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.pathPrefix | quote }}
      filters:
        # Strip /collectors/<name> so the service sees its own routes. One rule
        # for the whole fleet — no per-collector rewrite target. Today that
        # means the external path is /collectors/weather/weather/stadiums,
        # because weather's own routes are namespaced under /weather/. That
        # doubling is transitional: Phase 8's 8A replaces them with /signals.
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "generic-service.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
