{{- if .Values.grafanaAnnotations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "generic-service.fullname" . }}-grafana-annotate
  labels:
    {{- include "generic-service.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: annotate
          image: curlimages/curl:8.7.1
          resources:
            limits:
              cpu: 100m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
          command:
            - sh
            - -c
            - |
              curl -sf -X POST \
                {{ .Values.grafanaAnnotations.grafanaUrl }}/api/annotations \
                -H "Content-Type: application/json" \
                -u "{{ .Values.grafanaAnnotations.grafanaUser }}:{{ .Values.grafanaAnnotations.grafanaPassword }}" \
                -d "{\"text\":\"deploy: {{ .Values.service.name }} @ {{ .Values.image.tag | default .Chart.AppVersion }}\",\"tags\":[\"deploy\",\"{{ .Values.service.name }}\"]}" \
                || true
{{- end }}
