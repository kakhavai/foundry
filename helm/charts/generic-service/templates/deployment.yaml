{{- if not .Values.service.name }}
{{- fail "service.name must be set in your values file" }}
{{- end }}
{{- if not .Values.image.repository }}
{{- fail "image.repository must be set in your values file" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "generic-service.fullname" . }}
  labels:
    {{- include "generic-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "generic-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "generic-service.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.containerPort | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: {{ .Values.service.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "generic-service.fullname" . }}-config
          {{- if .Values.extraEnv }}
          env:
            {{- toYaml .Values.extraEnv | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            # A liveness probe must detect a hung process, not a busy one. With
            # Kubernetes' default timeoutSeconds: 1, a saturated event loop
            # fails /health within one second and the kubelet kills a container
            # that is merely overloaded — turning a slow service into an
            # unavailable one, and producing a restart loop during exactly the
            # traffic spike that caused it. Found by tests/load/spike.js, which
            # restarted player-projections reproducibly at 500 RPS against a
            # 250m CPU limit.
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            # Loosened to match liveness, deliberately, not by default: every
            # service here runs replicaCount: 1, so this is the only pod behind
            # the Service. The textbook purpose of a tight readiness probe is
            # to shed traffic onto a healthy sibling — there is no sibling
            # here, so tripping it under load does not shed load, it removes
            # the only Endpoint and turns a slow response into a hard
            # connection error for every in-flight and new request. A single
            # replica staying in rotation and answering slowly (what this
            # spike actually showed: 98.4% of requests still completed, just
            # with high tail latency) is strictly more useful to a caller than
            # 100% connection failures. Revisit if replicaCount ever exceeds 1
            # — with real siblings to shed load onto, a tight readiness probe
            # regains its textbook value.
            timeoutSeconds: 5
            failureThreshold: 3
