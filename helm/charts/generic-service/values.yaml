# Base chart — always lint with a per-service values file:
# helm lint helm/charts/generic-service -f helm/values/<service>/values.yaml

replicaCount: 1

service:
  name: ""        # required: set to the service name (e.g. weather)
  type: ClusterIP
  port: 8080      # port the Kubernetes Service exposes

image:
  repository: ""  # required: set to the container image (e.g. ghcr.io/kakhavai/foundry/weather)
  pullPolicy: IfNotPresent
  tag: ""         # defaults to appVersion in Chart.yaml if not set

containerPort: 8080  # port the container listens on (used in Deployment, Service, and probes)

# **The CPU request is a scheduling reservation, not a performance setting**,
# and on a single-node cluster it is the whole fleet's admission budget. The
# integration test runs every service on one 4-vCPU Kind node alongside the
# LGTM stack, so at the old 100m the 19th service failed to schedule with
# `Insufficient cpu` at 99% of allocatable — a ceiling that arrives on
# whichever PR happens to cross it rather than on the one that caused it, and
# the plan is 26 collectors.
#
# 25m is a floor for an idle FastAPI process, not a cap on one: the 250m limit
# is unchanged, so a capture pass still bursts to a quarter core. Only the
# reservation shrank. The fleet's summed request drops ~1.4 CPU, which is the
# difference between 99% and ~63% of the node.
#
# Memory requests are deliberately untouched. They are not the binding
# constraint — the fleet is ~2.4Gi of the node's 14.8Gi of requests, the rest
# being the observability stack — and memory limits are a real correctness
# guard here rather than a scheduling hint (roster-scope has been OOMKilled by
# holding one document three times).
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 25m
    memory: 128Mi

otel:
  endpoint: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"
  resourceAttributes: ""  # optional: OTel resource attributes in key=value,key2=value2 format

extraEnv: []  # extra env vars injected directly (supports secretKeyRef, fieldRef, etc.)

# Collector gateway. Off by default — only collectors are routed in from
# outside the cluster. player-projections consumes the generator's output and
# is deliberately not exposed.
gateway:
  enabled: false
  name: foundry                    # the Gateway to attach to
  namespace: envoy-gateway-system  # the Gateway's namespace
  pathPrefix: ""                   # required when enabled, e.g. /collectors/weather
  # Service-relative path prefixes the gateway may publish. Deliberately NOT
  # the whole service: /health and /metrics are exempt from bearer auth so the
  # kubelet's probes and Prometheus's annotation scrape can reach them, and a
  # probe cannot read a Secret — so requiring a token there would mean
  # committing one in plaintext. Exempting them in-cluster is correct;
  # publishing them at the edge is not, and a bare prefix rule did both.
  publicPaths:
    - /catalog
    - /signals
    - /refresh

grafanaAnnotations:
  enabled: false
  grafanaUrl: "http://grafana.monitoring.svc.cluster.local"
  grafanaUser: "admin"
  grafanaPassword: "admin"
