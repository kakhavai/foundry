service:
  name: broadcast-context
  port: 8022

image:
  repository: ghcr.io/kakhavai/foundry/broadcast-context

containerPort: 8022

# The chart defaults. Measure before raising either: roster-scope's first deploy
# was OOMKilled at 256Mi because its adapter buffered a 37 MB document three
# times, and raising the limit would have hidden the bug rather than fixed it.

otel:
  resourceAttributes: "service.name=broadcast-context,service.namespace=foundry"

grafanaAnnotations:
  enabled: true

gateway:
  enabled: true
  pathPrefix: /collectors/broadcast-context
  # Only the paths this collector publishes as its contract. /health and
  # /metrics are deliberately absent: they are exempt from bearer auth
  # in-process (a kubelet probe and a Prometheus scrape cannot carry a token),
  # and that is a reason to reach them in-cluster, not at the edge.
  # Add a path here when you add a route beyond the standard five.
  publicPaths:
    - /catalog
    - /signals
    - /refresh

extraEnv:
  # optional: true lets the pod start before the Secret exists. broadcast-context then
  # answers 503 on every data route until it arrives — the ArgoCD Application
  # reports Healthy the whole time, so recognise that combination for what it
  # is before assuming the deploy is broken.
  - name: COLLECTOR_TOKEN
    valueFrom:
      secretKeyRef:
        name: broadcast-context-collector-token
        key: token
        optional: true
  - name: LAKE_BUCKET
    value: "foundry-signals"
  - name: LAKE_ENDPOINT_URL
    value: "http://minio.monitoring.svc.cluster.local:9000"
  - name: REFRESH_MIN_INTERVAL_SECONDS
    value: "300"
  # "true", against the fleet default. `weather` is the ONLY other collector
  # that reaches a third party from its loop -- injury-report also ships true
  # but is in stub mode with empty URLs, and usage-share ships false. Three
  # reasons, in order:
  #
  #   1. ONE feed, 509 KB on the wire. Every collector shipping false does so
  #      because its upstream is 5-44 MiB; officiating reads 19.9 MiB a pass.
  #      This is three orders of magnitude cheaper, and conditional GET makes
  #      the steady state a single round trip carrying zero bytes.
  #   2. The flex history only exists if the loop runs. flex_status,
  #      previous_window_id and first_observed_at are derived by comparing
  #      each pass against this collector's own prior snapshots, so a
  #      collector that never captures reports every game as `original`
  #      forever and the spec's two-snapshot consistency check can never
  #      accumulate the evidence it asks for. That is not a degraded
  #      collector; it is the collector's product switched off.
  #   3. The spec asks for daily polling precisely because flex decisions land
  #      as late as six days out. A `weekly` cadence class is a 24h interval,
  #      so this is one 509 KB request a day per long-lived cluster.
  #
  # The honest cost of "true": every pod restart pays one full download,
  # because the ETag store is in memory, and a CI cluster is rebuilt on every
  # run. That is ~0.5 MB per CI run against raw.githubusercontent.com.
  #
  # What "true" does NOT buy on an ephemeral cluster: history still does not
  # accumulate there, because the lake is torn down with the cluster. The
  # value of this flag is entirely in a long-lived environment.
  - name: CAPTURE_ENABLED
    value: "true"
  # The loop's scope, and the lake partition every snapshot lands in. LEAVE
  # THE WEEK ALONE mid-season: the flex history is read from the partition the
  # capture writes to, so advancing it starts a fresh history in which every
  # game reads `original` again. The capture is season-wide regardless of the
  # week — `games_in_window` is a count over a whole slate.
  - name: CAPTURE_SEASON
    value: "2026"
  - name: CAPTURE_WEEK
    value: "1"
  # Wall-clock ceiling for one capture pass, so total upstream failure costs at
  # most this much rather than items x per-call timeout.
  - name: CAPTURE_DEADLINE_SECONDS
    value: "300"
  # Same optional:true pattern — the pod starts before the Secret exists and
  # the lake simply has no credentials until it arrives.
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: broadcast-context-lake-credentials
        key: access-key-id
        optional: true
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: broadcast-context-lake-credentials
        key: secret-access-key
        optional: true
  - name: AWS_DEFAULT_REGION
    value: "us-east-1"
