# Port 8018 follows the documented Phase 8 stage allocation rather than being
# the next free number: 8A-8B occupy 8000-8009, 8C is reserved 8010-8013 and 8D
# 8014-8017. Both of those stages are blocked on a paid vendor, so their ports
# are unclaimed today and will stay that way for a while — taking 8010 here
# would put this collector inside another stage's block and make the eventual
# 8C branch collide with an occupied port on a service it has nothing to do
# with. The gap is deliberate; do not close it.
service:
  name: venue
  port: 8018

image:
  repository: ghcr.io/kakhavai/foundry/venue

containerPort: 8018

# The chart defaults. Measure before raising either: roster-scope's first deploy
# was OOMKilled at 256Mi because its adapter buffered a 37 MB document three
# times, and raising the limit would have hidden the bug rather than fixed it.
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

otel:
  resourceAttributes: "service.name=venue,service.namespace=foundry"

grafanaAnnotations:
  enabled: true

gateway:
  enabled: true
  pathPrefix: /collectors/venue
  # Only the paths this collector publishes as its contract. /health and
  # /metrics are deliberately absent: they are exempt from bearer auth
  # in-process (a kubelet probe and a Prometheus scrape cannot carry a token),
  # and that is a reason to reach them in-cluster, not at the edge.
  # Add a path here when you add a route beyond the standard five.
  publicPaths:
    - /catalog
    - /signals
    - /refresh
    # venue's own extra route: GET /venues/{venue_id}/revisions. A PathPrefix
    # match, so the id and the trailing /revisions come along. Omit it and the
    # route works in-cluster and 404s at the edge, which reads like a broken
    # handler rather than a missing line here.
    - /venues

extraEnv:
  # optional: true lets the pod start before the Secret exists. venue then
  # answers 503 on every data route until it arrives — the ArgoCD Application
  # reports Healthy the whole time, so recognise that combination for what it
  # is before assuming the deploy is broken.
  - name: COLLECTOR_TOKEN
    valueFrom:
      secretKeyRef:
        name: venue-collector-token
        key: token
        optional: true
  - name: LAKE_BUCKET
    value: "foundry-signals"
  - name: LAKE_ENDPOINT_URL
    value: "http://minio.monitoring.svc.cluster.local:9000"
  - name: REFRESH_MIN_INTERVAL_SECONDS
    value: "300"
  # False, deliberately, and this collector is a clear case rather than a
  # scaffold default nobody revisited. `venue_static` needs no network at all —
  # it reads a committed table — but `venue_game_assignment` streams the ~2.1 MB
  # nflverse game table, and the Kind cluster is rebuilt on every CI run while
  # every pod restart re-captures. A `static reference` cadence has nothing to
  # gain from that: the answer changes a handful of times a season.
  #
  # Consequence for the smoke hook: a dispatched POST /refresh reaches the
  # upstream REGARDLESS of this flag, so services/venue/smoke.sh must not post
  # one. It exercises the extra route instead, which serves from the committed
  # table and therefore answers correctly with no capture at all.
  - name: CAPTURE_ENABLED
    value: "false"
  - name: CAPTURE_SEASON
    value: "2026"
  - name: CAPTURE_WEEK
    value: "1"
  # Wall-clock ceiling for one capture pass, so total upstream failure costs at
  # most this much rather than items x per-call timeout.
  - name: CAPTURE_DEADLINE_SECONDS
    value: "300"
  # Same optional:true pattern — the pod starts before the Secret exists and
  # the lake simply has no credentials until it arrives.
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: venue-lake-credentials
        key: access-key-id
        optional: true
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: venue-lake-credentials
        key: secret-access-key
        optional: true
  - name: AWS_DEFAULT_REGION
    value: "us-east-1"
