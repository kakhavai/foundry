service:
  name: coaching-scheme
  port: 8023

image:
  repository: ghcr.io/kakhavai/foundry/coaching-scheme

containerPort: 8023

# The chart defaults. Measure before raising either: roster-scope's first deploy
# was OOMKilled at 256Mi because its adapter buffered a 37 MB document three
# times, and raising the limit would have hidden the bug rather than fixed it.
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

otel:
  resourceAttributes: "service.name=coaching-scheme,service.namespace=foundry"

grafanaAnnotations:
  enabled: true

gateway:
  enabled: true
  pathPrefix: /collectors/coaching-scheme
  # Only the paths this collector publishes as its contract. /health and
  # /metrics are deliberately absent: they are exempt from bearer auth
  # in-process (a kubelet probe and a Prometheus scrape cannot carry a token),
  # and that is a reason to reach them in-cluster, not at the edge.
  # Add a path here when you add a route beyond the standard five.
  publicPaths:
    - /catalog
    - /signals
    - /refresh
    # coaching-scheme's own extra route: GET /teams/{team_id}/revisions. A
    # PathPrefix match, so the id and the ?season= query come along. Omit it
    # and the route works in-cluster and 404s at the edge, which reads like a
    # broken handler rather than a missing line here.
    - /teams

extraEnv:
  # optional: true lets the pod start before the Secret exists. coaching-scheme then
  # answers 503 on every data route until it arrives — the ArgoCD Application
  # reports Healthy the whole time, so recognise that combination for what it
  # is before assuming the deploy is broken.
  - name: COLLECTOR_TOKEN
    valueFrom:
      secretKeyRef:
        name: coaching-scheme-collector-token
        key: token
        optional: true
  - name: LAKE_BUCKET
    value: "foundry-signals"
  - name: LAKE_ENDPOINT_URL
    value: "http://minio.monitoring.svc.cluster.local:9000"
  - name: REFRESH_MIN_INTERVAL_SECONDS
    value: "300"
  # False, deliberately, with the numbers rather than as a scaffold default
  # nobody revisited. One pass reads FOUR upstreams. Sizes are what goes over
  # the WIRE for the request httpx actually sends (it offers
  # `Accept-Encoding: gzip`), measured live on 2026-08-01:
  #
  #     games.csv                        0.49 MiB  (2.07 MiB parsed --
  #                                                 raw.githubusercontent.com
  #                                                 transfer-encodes it)
  #     play_by_play_<season>.csv.gz    18.22 MiB  (93.41 MiB uncompressed)
  #     ftn_charting_<season>.csv        7.75 MiB  (no .gz published)
  #     pbp_participation_<season>.csv  46.82 MiB  (no .gz published)
  #     -----------------------------------------
  #                                     73.28 MiB per changed pass
  #
  # That is 3.7x `officiating`'s 19.9 MiB, which already ships false, and it
  # is the largest per-pass footprint in the fleet. `seasonal` polls daily and
  # the Kind cluster is rebuilt on every CI run, so a `true` here would pull
  # ~73 MiB from GitHub on every PR.
  #
  # AND THE COLLECTOR HAS NO WORKING REGIME DETECTOR, which is a reason to
  # keep the loop off rather than a reason to turn it on. Guard 2 -- the PROE
  # changepoint test the spec asks for -- ships DISABLED: measured over five
  # live seasons it fires on 65% of real team-seasons and 55% of
  # week-SHUFFLED ones, and a properly calibrated permutation version has a
  # recall of 0/13 against known coaching changes. See
  # services/coaching-scheme/coaching_scheme/changepoint.py. Enabling capture
  # would pull 73 MiB a pass to feed a detector that is switched off.
  #
  # THE ARGUMENT THAT MADE broadcast-context SHIP "true" DOES NOT APPLY HERE,
  # and that is the part worth reading rather than the arithmetic.
  # broadcast-context ships true at 509 KB because its guard is *vacuous*
  # without a running loop: its flex history is derived by comparing each pass
  # against its OWN prior lake snapshots, so a collector that never captures
  # reports every game as `original` forever -- the product switched off, not
  # degraded.
  #
  # This collector has no such dependency. BOTH its guards are computable from
  # a single pass:
  #
  #   * the staff-revision timeline comes from games.csv's per-week coach
  #     columns, which carry the whole season in one document; and
  #   * the changepoint series comes from play-by-play's per-week plays, also
  #     the whole season in one document.
  #
  # Nothing here reads back a prior snapshot. One dispatched `POST /refresh`
  # produces exactly the same answer a loop running since week 1 would. So the
  # size argument is uncontested and false is right.
  #
  # The cost of false, stated: `change_reported_at` stays null forever. An
  # observation-derived upper bound on it (broadcast-context's
  # `first_observed_at` shape) WOULD need the loop -- and it is deliberately
  # not built, precisely so this collector's product stays complete from one
  # pass. See services/coaching-scheme/README.md.
  #
  # Conditional GET makes the STEADY state cheap (all four feeds serve ETags
  # and answer If-None-Match with a 304 carrying zero bytes, verified live),
  # but it cannot help a fresh pod: the ETag store is in memory, so every
  # restart pays the full 73.28 MiB again. That is the cost this flag controls.
  #
  # Consequence for the smoke hook: a dispatched POST /refresh reaches the
  # upstreams REGARDLESS of this flag, so services/coaching-scheme/smoke.sh
  # must not post one. It exercises GET /teams/{team_id}/revisions instead,
  # which needs no capture to answer correctly.
  - name: CAPTURE_ENABLED
    value: "false"
  - name: CAPTURE_SEASON
    value: "2026"
  - name: CAPTURE_WEEK
    value: "1"
  # Wall-clock ceiling for one capture pass, so total upstream failure costs at
  # most this much rather than items x per-call timeout.
  - name: CAPTURE_DEADLINE_SECONDS
    value: "300"
  # Same optional:true pattern — the pod starts before the Secret exists and
  # the lake simply has no credentials until it arrives.
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: coaching-scheme-lake-credentials
        key: access-key-id
        optional: true
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: coaching-scheme-lake-credentials
        key: secret-access-key
        optional: true
  - name: AWS_DEFAULT_REGION
    value: "us-east-1"
