service:
  name: usage-share
  port: 8005

image:
  repository: ghcr.io/kakhavai/foundry/usage-share

containerPort: 8005

# The chart defaults. Measure before raising either: roster-scope's first deploy
# was OOMKilled at 256Mi because its adapter buffered a 37 MB document three
# times, and raising the limit would have hidden the bug rather than fixed it.
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

otel:
  resourceAttributes: "service.name=usage-share,service.namespace=foundry"

grafanaAnnotations:
  enabled: true

gateway:
  enabled: true
  pathPrefix: /collectors/usage-share
  # Only the paths this collector publishes as its contract. /health and
  # /metrics are deliberately absent: they are exempt from bearer auth
  # in-process (a kubelet probe and a Prometheus scrape cannot carry a token),
  # and that is a reason to reach them in-cluster, not at the edge.
  # Add a path here when you add a route beyond the standard five.
  publicPaths:
    - /catalog
    - /signals
    - /refresh

extraEnv:
  # optional: true lets the pod start before the Secret exists. usage-share then
  # answers 503 on every data route until it arrives — the ArgoCD Application
  # reports Healthy the whole time, so recognise that combination for what it
  # is before assuming the deploy is broken.
  - name: COLLECTOR_TOKEN
    valueFrom:
      secretKeyRef:
        name: usage-share-collector-token
        key: token
        optional: true
  # Not optional in the way roster-scope's and player-stats' are. This
  # collector narrows FORWARD -- every upstream row's GSIS id is resolved here
  # and checked against roster-scope's membership list -- so an empty value is
  # not "run unnarrowed", it is "resolve nothing, narrow to nothing, publish
  # nothing". `usage_share/adapters/scope.py` therefore fails closed on an
  # empty value rather than falling back to a stub id space that could never
  # intersect the scope: zero upstream calls and a present:0 envelope saying
  # `identity_unavailable`, instead of an ~8.3 MB season CSV fetched to publish
  # an empty week.
  - name: PLAYER_IDENTITY_URL
    value: "http://player-identity:8002"
  - name: LAKE_BUCKET
    value: "foundry-signals"
  - name: LAKE_ENDPOINT_URL
    value: "http://minio.monitoring.svc.cluster.local:9000"
  - name: REFRESH_MIN_INTERVAL_SECONDS
    value: "300"
  # Stays "false", and it is a LOAD decision rather than a way to dodge a
  # startup bug — the container is exercised with this exact environment, and
  # with CAPTURE_ENABLED=true, in the PR's UAT. The upstream is an ~8.3 MB
  # season CSV published by a volunteer project on GitHub releases, and the
  # cluster is recreated on every CI run while every pod restart re-captures.
  # `player-identity` and `roster-scope` ship false for the same reason.
  #
  # A dispatched POST /refresh reaches the upstream regardless of this flag,
  # which is why this collector has no smoke hook that posts one.
  - name: CAPTURE_ENABLED
    value: "false"
  - name: CAPTURE_SEASON
    value: "2026"
  - name: CAPTURE_WEEK
    value: "1"
  # Wall-clock ceiling for one capture pass, so total upstream failure costs at
  # most this much rather than items x per-call timeout.
  - name: CAPTURE_DEADLINE_SECONDS
    value: "300"
  # Same optional:true pattern — the pod starts before the Secret exists and
  # the lake simply has no credentials until it arrives.
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: usage-share-lake-credentials
        key: access-key-id
        optional: true
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: usage-share-lake-credentials
        key: secret-access-key
        optional: true
  - name: AWS_DEFAULT_REGION
    value: "us-east-1"
