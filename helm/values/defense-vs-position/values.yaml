service:
  name: defense-vs-position
  port: 8025

image:
  repository: ghcr.io/kakhavai/foundry/defense-vs-position

containerPort: 8025

# The chart defaults. Measure before raising either: roster-scope's first deploy
# was OOMKilled at 256Mi because its adapter buffered a 37 MB document three
# times, and raising the limit would have hidden the bug rather than fixed it.
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

otel:
  resourceAttributes: "service.name=defense-vs-position,service.namespace=foundry"

grafanaAnnotations:
  enabled: true

gateway:
  enabled: true
  pathPrefix: /collectors/defense-vs-position
  # Only the paths this collector publishes as its contract. /health and
  # /metrics are deliberately absent: they are exempt from bearer auth
  # in-process (a kubelet probe and a Prometheus scrape cannot carry a token),
  # and that is a reason to reach them in-cluster, not at the edge.
  # Add a path here when you add a route beyond the standard five.
  publicPaths:
    - /catalog
    - /signals
    - /refresh

extraEnv:
  # optional: true lets the pod start before the Secret exists. defense-vs-position then
  # answers 503 on every data route until it arrives — the ArgoCD Application
  # reports Healthy the whole time, so recognise that combination for what it
  # is before assuming the deploy is broken.
  - name: COLLECTOR_TOKEN
    valueFrom:
      secretKeyRef:
        name: defense-vs-position-collector-token
        key: token
        optional: true
  - name: LAKE_BUCKET
    value: "foundry-signals"
  - name: LAKE_ENDPOINT_URL
    value: "http://minio.monitoring.svc.cluster.local:9000"
  - name: REFRESH_MIN_INTERVAL_SECONDS
    value: "300"
  # Stays false, and the decisive argument is not the bandwidth.
  #
  # A changed pass costs 20.61 MiB (play_by_play_<season>.csv.gz 18.22 +
  # players.csv.gz 2.39) on a one-day base interval, with conditional GET on
  # both so an unchanged poll costs one round trip. That alone would be
  # arguable. What settles it:
  #
  #   1. CAPTURE_SEASON below is 2026 and play_by_play_2026.csv.gz 404s today
  #      -- the season has not started. With the loop on, every pod start
  #      writes a `present: 0` failure envelope and pins
  #      collector_coverage_ratio at 0.0 indefinitely. A permanently red gauge
  #      for zero data is how operators learn to ignore a gauge.
  #   2. The Kind cluster is recreated on every integration-test run and every
  #      pod restart re-captures, so "true" means 20.61 MiB from GitHub
  #      release assets per CI run against an artifact that does not exist.
  #   3. Nothing here is vacuous without a running loop. broadcast-context
  #      ships true only because its own guard cannot be exercised otherwise;
  #      this collector's rank-divergence guard runs inside `capture`, is
  #      driven by the service suite against a synthetic 32-team season, and
  #      was measured against the real 2025 artifact offline.
  #
  # Flip to "true" once CAPTURE_SEASON names a season whose artifact exists.
  # A dispatched POST /refresh reaches nflverse regardless of this flag.
  - name: CAPTURE_ENABLED
    value: "false"
  # The player-identity seam. Empty fails the capture CLOSED with reason
  # `identity_unavailable` rather than publishing ratings built from
  # unresolved ids -- see adapters/identity.py.
  - name: PLAYER_IDENTITY_URL
    value: "http://player-identity:8002"
  - name: CAPTURE_SEASON
    value: "2026"
  - name: CAPTURE_WEEK
    value: "1"
  # Wall-clock ceiling for one capture pass, so total upstream failure costs at
  # most this much rather than items x per-call timeout.
  - name: CAPTURE_DEADLINE_SECONDS
    value: "300"
  # Same optional:true pattern — the pod starts before the Secret exists and
  # the lake simply has no credentials until it arrives.
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: defense-vs-position-lake-credentials
        key: access-key-id
        optional: true
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: defense-vs-position-lake-credentials
        key: secret-access-key
        optional: true
  - name: AWS_DEFAULT_REGION
    value: "us-east-1"
