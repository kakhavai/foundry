service:
  name: injury-report
  port: 8007

image:
  repository: ghcr.io/kakhavai/foundry/injury-report

containerPort: 8007

# The chart defaults. Measure before raising either: roster-scope's first deploy
# was OOMKilled at 256Mi because its adapter buffered a 37 MB document three
# times, and raising the limit would have hidden the bug rather than fixed it.
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

otel:
  resourceAttributes: "service.name=injury-report,service.namespace=foundry"

grafanaAnnotations:
  enabled: true

gateway:
  enabled: true
  pathPrefix: /collectors/injury-report
  # Only the paths this collector publishes as its contract. /health and
  # /metrics are deliberately absent: they are exempt from bearer auth
  # in-process (a kubelet probe and a Prometheus scrape cannot carry a token),
  # and that is a reason to reach them in-cluster, not at the edge.
  # Add a path here when you add a route beyond the standard five.
  publicPaths:
    - /catalog
    - /signals
    - /refresh

extraEnv:
  # optional: true lets the pod start before the Secret exists. injury-report then
  # answers 503 on every data route until it arrives — the ArgoCD Application
  # reports Healthy the whole time, so recognise that combination for what it
  # is before assuming the deploy is broken.
  - name: COLLECTOR_TOKEN
    valueFrom:
      secretKeyRef:
        name: injury-report-collector-token
        key: token
        optional: true
  - name: LAKE_BUCKET
    value: "foundry-signals"
  - name: LAKE_ENDPOINT_URL
    value: "http://minio.monitoring.svc.cluster.local:9000"
  - name: REFRESH_MIN_INTERVAL_SECONDS
    value: "300"
  # Both upstreams below ship EMPTY, which selects the in-process stub week —
  # no third party is reached at all, so the usual reason to leave the loop off
  # (a large or rate-limited upstream, re-fetched on every pod restart and
  # every CI cluster) does not apply here. Left on so the collector's own
  # signals are real on day one: `collector_coverage_ratio`,
  # `collector_staleness_seconds` and `injury_report_teams_published` all need
  # a pass to have happened before they mean anything.
  #
  # **Revisit this line in the same change that sets INJURY_REPORT_URL.** A
  # dispatched POST /refresh reaches the upstream regardless of this flag, so
  # flipping the URL without reconsidering the cadence puts a 15-minute poll on
  # a third party.
  - name: CAPTURE_ENABLED
    value: "true"
  # Empty selects the deterministic stub for each. The intended real values are
  # the league's own weekly injury report feed and the nflverse games file that
  # `weather` already reads:
  #   SCHEDULE_URL: https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv
  # `INJURY_REPORT_URL` takes `{season}` and `{week}` placeholders.
  #
  # They are two separate upstreams on purpose: the schedule is this
  # collector's coverage DENOMINATOR, and a denominator read out of the injury
  # feed itself could not tell a truncated feed from a quiet week.
  - name: INJURY_REPORT_URL
    value: ""
  - name: SCHEDULE_URL
    value: ""
  # Empty means "no player-identity deployment to talk to", which mints
  # deterministic ids in-process. Setting it before the HTTP resolver exists
  # fails the affected rows loudly rather than minting stub ids against a
  # cluster configured to expect real ones — see adapters/identity.py.
  - name: PLAYER_IDENTITY_URL
    value: ""
  - name: CAPTURE_SEASON
    value: "2026"
  - name: CAPTURE_WEEK
    value: "1"
  # Wall-clock ceiling for one capture pass, so total upstream failure costs at
  # most this much rather than items x per-call timeout.
  - name: CAPTURE_DEADLINE_SECONDS
    value: "300"
  # Same optional:true pattern — the pod starts before the Secret exists and
  # the lake simply has no credentials until it arrives.
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: injury-report-lake-credentials
        key: access-key-id
        optional: true
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: injury-report-lake-credentials
        key: secret-access-key
        optional: true
  - name: AWS_DEFAULT_REGION
    value: "us-east-1"
