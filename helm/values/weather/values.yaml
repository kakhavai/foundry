service:
  name: weather
  port: 8000

image:
  repository: ghcr.io/kakhavai/foundry/weather

containerPort: 8000


otel:
  resourceAttributes: "service.name=weather,service.namespace=foundry"

grafanaAnnotations:
  enabled: true

gateway:
  enabled: true
  pathPrefix: /collectors/weather

extraEnv:
  - name: FAULT_UPSTREAM_LATENCY_MS
    value: "0"
  - name: FAULT_UPSTREAM_ERROR_RATE
    value: "0"
  # optional: true lets the pod start before the Secret exists. weather then
  # answers 503 on every data route until it arrives — see
  # libs/collector-core/collector_core/auth.py, mounted by collector_core.app.
  - name: COLLECTOR_TOKEN
    valueFrom:
      secretKeyRef:
        name: weather-collector-token
        key: token
        optional: true
  - name: LAKE_BUCKET
    value: "foundry-signals"
  - name: LAKE_ENDPOINT_URL
    value: "http://minio.monitoring.svc.cluster.local:9000"
  - name: REFRESH_MIN_INTERVAL_SECONDS
    value: "300"
  # Off by default in code so tests and bare uvicorn runs stay hermetic;
  # the deployed collector is the only place the loop actually runs.
  - name: CAPTURE_ENABLED
    value: "true"
  - name: CAPTURE_SEASON
    value: "2026"
  - name: CAPTURE_WEEK
    value: "1"
  # Wall-clock ceiling for one capture_week pass, checked between games and
  # between venues; a run over budget records deadline_exceeded per remaining
  # key instead of discarding what it already captured.
  - name: CAPTURE_DEADLINE_SECONDS
    value: "300"
  # Same optional:true pattern as COLLECTOR_TOKEN — the pod starts before the
  # Secret exists and the lake simply has no credentials until it arrives.
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: weather-lake-credentials
        key: access-key-id
        optional: true
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: weather-lake-credentials
        key: secret-access-key
        optional: true
  - name: AWS_DEFAULT_REGION
    value: "us-east-1"
