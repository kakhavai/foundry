service:
  name: weather
  port: 8000

image:
  repository: ghcr.io/kakhavai/foundry/weather

containerPort: 8000

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

otel:
  resourceAttributes: "service.name=weather,service.namespace=foundry"

grafanaAnnotations:
  enabled: true

gateway:
  enabled: true
  pathPrefix: /collectors/weather

extraEnv:
  - name: FAULT_UPSTREAM_LATENCY_MS
    value: "0"
  - name: FAULT_UPSTREAM_ERROR_RATE
    value: "0"
  # optional: true lets the pod start before the Secret exists. weather then
  # answers 503 on every data route until it arrives — see weather/auth.py.
  - name: COLLECTOR_TOKEN
    valueFrom:
      secretKeyRef:
        name: weather-collector-token
        key: token
        optional: true
