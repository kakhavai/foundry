service:
  name: roster-scope
  port: 8003

image:
  repository: ghcr.io/kakhavai/foundry/roster-scope

containerPort: 8003

# The chart defaults, kept deliberately and now backed by a measurement rather
# than by nobody having checked.
#
# The first deploy OOM-killed this pod at 256Mi (exit 137, CrashLoopBackOff):
# the candidate upstream publishes a ~37 MB document, the adapter buffered it
# three times over, and it retained every row of a season-long snapshot
# series. Both are fixed in the adapter — it streams, and it keeps only the
# newest row per in-scope slot. A full fetch-and-parse of the real feed now
# peaks at **38.5 MiB RSS** and retains 983 rows, so 256Mi has ample headroom
# and raising it would have hidden the bug rather than fixed it.

otel:
  resourceAttributes: "service.name=roster-scope,service.namespace=foundry"

grafanaAnnotations:
  enabled: true

gateway:
  enabled: true
  pathPrefix: /collectors/roster-scope
  # The chart's default publishes only /catalog, /signals and /refresh. This
  # collector's whole point is the resolved list every other collector fetches,
  # so /scope is published too. /health and /metrics stay unrouted: they are
  # exempt from bearer auth in-process (the kubelet's probes and Prometheus's
  # scrape cannot carry a token) and that is not a reason to expose them at
  # the edge.
  #
  # /scope is a PathPrefix match, so it already publishes every /scope/*
  # sub-route in-cluster (players, rules, diff, matchups) without a separate
  # entry per route. /scope/matchups is still listed explicitly, matching
  # every other collector's convention of naming a route beyond the standard
  # five outright rather than relying on a reader noticing the prefix covers
  # it too.
  publicPaths:
    - /catalog
    - /signals
    - /refresh
    - /scope
    - /scope/matchups

extraEnv:
  # optional: true lets the pod start before the Secret exists. roster-scope
  # then answers 503 on every data route until it arrives — see
  # libs/collector-core/collector_core/auth.py, mounted by collector_core.app.
  - name: COLLECTOR_TOKEN
    valueFrom:
      secretKeyRef:
        name: roster-scope-collector-token
        key: token
        optional: true
  # `player-identity` is deployed and its `GET /resolve` contract (see
  # adapters/identity.py's `HttpPlayerIdentityResolver`) is reconciled against
  # the real service — see services/player-identity/player_identity/api.py's
  # `resolve_query`. Empty falls back to the built-in stub resolver
  # (deterministic `fdy-` ids minted from normalized name/team/position);
  # `build_resolver` still selects that fallback whenever this is unset, which
  # is exactly what tests and local runs (no PLAYER_IDENTITY_URL set in
  # scripts/deploy-local.py's env) rely on.
  - name: PLAYER_IDENTITY_URL
    value: "http://player-identity:8002"
  - name: LAKE_BUCKET
    value: "foundry-signals"
  - name: LAKE_ENDPOINT_URL
    value: "http://minio.monitoring.svc.cluster.local:9000"
  - name: REFRESH_MIN_INTERVAL_SECONDS
    value: "300"
  # DELIBERATELY false, matching player-identity rather than weather.
  #
  # The candidate upstream's published asset is ~37 MB — seven times the
  # document that led player-identity to the same decision — and this
  # collector's cadence class is `weekly`. weather's precedent would pull
  # 37 MB from a third party on every PR push and every pod restart, from a
  # cluster that is recreated per CI run.
  #
  # This is a third-party-load decision, NOT a workaround for the OOM that
  # broke the first deploy. That bug is fixed in the adapter and verified
  # against the real feed at 38.5 MiB peak inside the 256Mi limit above —
  # the memory limit is unchanged. Flipping this to "true" in an environment
  # that should actually be polling is a one-line change, not a re-run of
  # that investigation.
  #
  # Consequence for the smoke test: it must not POST /refresh either, since a
  # dispatched refresh reaches the upstream regardless of this flag.
  - name: CAPTURE_ENABLED
    value: "false"
  - name: CAPTURE_SEASON
    value: "2026"
  - name: CAPTURE_WEEK
    value: "1"
  # Wall-clock ceiling for one capture pass, checked between teams; a run over
  # budget records deadline_exceeded per remaining slot instead of discarding
  # what it already resolved.
  - name: CAPTURE_DEADLINE_SECONDS
    value: "300"
  # Same optional:true pattern as COLLECTOR_TOKEN — the pod starts before the
  # Secret exists and the lake simply has no credentials until it arrives.
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: roster-scope-lake-credentials
        key: access-key-id
        optional: true
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: roster-scope-lake-credentials
        key: secret-access-key
        optional: true
  - name: AWS_DEFAULT_REGION
    value: "us-east-1"
