service:
  name: depth-chart
  port: 8006

image:
  repository: ghcr.io/kakhavai/foundry/depth-chart

containerPort: 8006

# The chart defaults. Measure before raising either: roster-scope's first deploy
# was OOMKilled at 256Mi because its adapter buffered a 37 MB document three
# times, and raising the limit would have hidden the bug rather than fixed it.

otel:
  resourceAttributes: "service.name=depth-chart,service.namespace=foundry"

grafanaAnnotations:
  enabled: true

gateway:
  enabled: true
  pathPrefix: /collectors/depth-chart
  # Only the paths this collector publishes as its contract. /health and
  # /metrics are deliberately absent: they are exempt from bearer auth
  # in-process (a kubelet probe and a Prometheus scrape cannot carry a token),
  # and that is a reason to reach them in-cluster, not at the edge.
  # Add a path here when you add a route beyond the standard five.
  publicPaths:
    - /catalog
    - /signals
    # The spec's extra route. Published explicitly: the gateway rewrites onto
    # each declared entry, so `/signals` alone does NOT carry `/signals/diff`
    # through — it would work in-cluster and 404 at the edge.
    - /signals/diff
    - /refresh

extraEnv:
  # optional: true lets the pod start before the Secret exists. depth-chart then
  # answers 503 on every data route until it arrives — the ArgoCD Application
  # reports Healthy the whole time, so recognise that combination for what it
  # is before assuming the deploy is broken.
  - name: COLLECTOR_TOKEN
    valueFrom:
      secretKeyRef:
        name: depth-chart-collector-token
        key: token
        optional: true
  - name: LAKE_BUCKET
    value: "foundry-signals"
  - name: LAKE_ENDPOINT_URL
    value: "http://minio.monitoring.svc.cluster.local:9000"
  - name: REFRESH_MIN_INTERVAL_SECONDS
    value: "300"
  # FALSE AS A LOAD DECISION, not to dodge a startup bug — the same call
  # player-identity and roster-scope made, for the same reason. The upstream
  # asset is **52.9 MB** (measured `Content-Length`, 2026-07-30) and this
  # collector's cadence class is `volatile`, i.e. every 15 minutes. Left on,
  # every CI cluster and every pod restart would pull ~5 GB/day from a free
  # community mirror this project does not pay for. `POST /refresh` still
  # reaches the upstream regardless of this flag, which is how the route is
  # exercised deliberately rather than continuously.
  - name: CAPTURE_ENABLED
    value: "false"
  - name: CAPTURE_SEASON
    value: "2026"
  - name: CAPTURE_WEEK
    value: "1"
  # Wall-clock ceiling for one capture pass, so total upstream failure costs at
  # most this much rather than items x per-call timeout.
  - name: CAPTURE_DEADLINE_SECONDS
    value: "300"
  # Same optional:true pattern — the pod starts before the Secret exists and
  # the lake simply has no credentials until it arrives.
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: depth-chart-lake-credentials
        key: access-key-id
        optional: true
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: depth-chart-lake-credentials
        key: secret-access-key
        optional: true
  - name: AWS_DEFAULT_REGION
    value: "us-east-1"
