service:
  name: officiating
  port: 8021

image:
  repository: ghcr.io/kakhavai/foundry/officiating

containerPort: 8021

# The chart defaults. Measure before raising either: roster-scope's first deploy
# was OOMKilled at 256Mi because its adapter buffered a 37 MB document three
# times, and raising the limit would have hidden the bug rather than fixed it.
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

otel:
  resourceAttributes: "service.name=officiating,service.namespace=foundry"

grafanaAnnotations:
  enabled: true

gateway:
  enabled: true
  pathPrefix: /collectors/officiating
  # Only the paths this collector publishes as its contract. /health and
  # /metrics are deliberately absent: they are exempt from bearer auth
  # in-process (a kubelet probe and a Prometheus scrape cannot carry a token),
  # and that is a reason to reach them in-cluster, not at the edge.
  # Add a path here when you add a route beyond the standard five.
  publicPaths:
    - /catalog
    - /signals
    - /refresh
    # officiating's own extra route: GET /crews/{crew_id}. A PathPrefix match,
    # so the id comes along. Omit it and the route works in-cluster and 404s at
    # the edge, which reads like a broken handler rather than a missing line
    # here.
    - /crews

extraEnv:
  # optional: true lets the pod start before the Secret exists. officiating then
  # answers 503 on every data route until it arrives — the ArgoCD Application
  # reports Healthy the whole time, so recognise that combination for what it
  # is before assuming the deploy is broken.
  - name: COLLECTOR_TOKEN
    valueFrom:
      secretKeyRef:
        name: officiating-collector-token
        key: token
        optional: true
  - name: LAKE_BUCKET
    value: "foundry-signals"
  - name: LAKE_ENDPOINT_URL
    value: "http://minio.monitoring.svc.cluster.local:9000"
  - name: REFRESH_MIN_INTERVAL_SECONDS
    value: "300"
  # False, deliberately, with the numbers rather than as a scaffold default
  # nobody revisited. One pass reads three upstreams. Sizes are what goes over
  # the WIRE for the request httpx actually sends (it offers
  # `Accept-Encoding: gzip`), measured live on 2026-08-01:
  #
  #     games.csv                       0.49 MiB   (2.07 MiB once parsed --
  #                                                 raw.githubusercontent.com
  #                                                 transfer-encodes it)
  #     officials.csv                   1.23 MiB   (release asset, not encoded)
  #     play_by_play_<season>.csv.gz   18.2  MiB   (93.4 MiB uncompressed)
  #     ----------------------------------------
  #                                    19.9  MiB per changed pass
  #
  # That is four times what `player-identity` ships false for (~5 MB) and about
  # half of `player-profile`'s cold read. The Kind cluster is rebuilt on every
  # CI run and every pod restart re-captures, so a true here would pull ~20 MiB
  # from GitHub on every PR — for a collector whose entire product is eight
  # numbers per crew, recomputed weekly.
  #
  # Conditional GET makes the STEADY state cheap (all three feeds serve ETags
  # and answer If-None-Match with a 304 carrying zero bytes, verified live),
  # but it cannot help a fresh pod: the ETag store is in memory, so every
  # restart pays the full 19.9 MiB again. That is the cost this flag controls.
  #
  # Consequence for the smoke hook: a dispatched POST /refresh reaches the
  # upstreams REGARDLESS of this flag, so services/officiating/smoke.sh must
  # not post one. It exercises GET /crews/{crew_id} instead, which needs no
  # capture to answer correctly.
  - name: CAPTURE_ENABLED
    value: "false"
  - name: CAPTURE_SEASON
    value: "2026"
  - name: CAPTURE_WEEK
    value: "1"
  # Wall-clock ceiling for one capture pass, so total upstream failure costs at
  # most this much rather than items x per-call timeout.
  - name: CAPTURE_DEADLINE_SECONDS
    value: "300"
  # Same optional:true pattern — the pod starts before the Secret exists and
  # the lake simply has no credentials until it arrives.
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: officiating-lake-credentials
        key: access-key-id
        optional: true
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: officiating-lake-credentials
        key: secret-access-key
        optional: true
  - name: AWS_DEFAULT_REGION
    value: "us-east-1"
