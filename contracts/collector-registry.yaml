# The collector registry — the inventory of collectors that are DEPLOYED.
#
# Not the plan. The staging table in
# docs/architecture/phase-8-data-source-collectors.md lists all twenty-six
# collectors in the catalog and the stage each is scheduled for; this file
# lists only the ones that exist as a running service today. The two are
# deliberately different documents:
#
#   the staging table is the plan     — it may name a service that has no code
#   this registry is the inventory    — every entry must have a deployed service
#
# That distinction is what gives the CI drift gate its teeth. The phase doc's
# first assertion is "every registry entry has a deployed collector, and every
# deployed collector has a registry entry". Pre-listing the twenty-three
# unbuilt collectors would red that gate on day one, and the only way back to
# green would be to weaken the assertion into nothing.
#
# The consequence, and it is a mechanical one rather than a convention:
#
#   * an entry lands in the SAME PR as the service it describes, and
#   * after the PRs that add its `depends_on` entries.
#
# A PR that adds an entry for a service that does not exist yet fails
# tests/test_collector_registry.py. A PR that adds an entry depending on an
# unregistered collector fails the same suite. Merge order therefore falls out
# of the gate rather than out of anybody remembering it.
#
# APPEND-ONLY. Entries are in merge order, not sorted. Nothing in the gate
# requires this file to be sorted, grouped, or regenerated, so two collectors
# added in two branches merge as a plain append with no conflict beyond the
# last line. Do not reorder or reformat existing entries to tidy it up.
#
# Shape is enforced by contracts/collector-registry.schema.json. What each
# field means, and what actually checks it:
#
#   name             the collector, and the directory name under services/
#   path             the gateway prefix; must equal helm/values/<name>/
#                    values.yaml's gateway.pathPrefix
#   stage            the phase-8 sub-stage that shipped it — documentary
#   cadence_class    one of collector_core.cadence.CadenceClass's values;
#                    must match what the service's CollectorDescriptor declares
#   envelope_version STRING — settled deliberately, not a formatting quirk.
#                    Everything else in the repo already agreed:
#                    collector_core.envelope.ENVELOPE_VERSION is the string
#                    "1" because it becomes the lake path segment `v1`,
#                    contracts/signal-envelope/envelope.v1.schema.json
#                    declares {"const": "1"}, all six committed fixtures write
#                    "1", and `GET /catalog` returns that string. The registry
#                    was the sole outlier, and only because one line of the
#                    phase doc wrote it unquoted — while that same doc's
#                    ENVELOPE example writes it quoted. The old
#                    str(registry) == str(catalog) comparison was rejected as
#                    a workaround rather than a decision: it would also have
#                    passed 1 against "1.0". Both gates now compare exactly.
#   signal_types     must match the CollectorDescriptor's declared tuple
#   scope_aware      whether the collector narrows to the roster scope.
#                    tests/test_scope_aware_gate.py checks it STRUCTURALLY: a
#                    collector declaring `true` must import
#                    collector_core.scope.ScopeClient, read by AST for the
#                    same reason this file's own gate is (platform-tests has
#                    no fastapi/httpx). That proves the narrowing code path
#                    exists, not that it behaves correctly — whether a capture
#                    actually fails closed and drops out-of-scope rows is
#                    proven per-collector by that collector's own test suite
#                    (e.g. services/usage-share/tests/), never by this file.
#                    A collector could still import the seam and call it
#                    wrongly; that residual gap is human-reviewed, same as
#                    before, just smaller than "the whole claim."
#                    NOTE the flag means "uses the scope", which covers two
#                    genuinely different behaviours and does not distinguish
#                    them: NARROWING WHAT IT PUBLISHES (usage-share drops
#                    out-of-scope rows; injury-report drops them from
#                    player_injury_status, though team_injury_report is
#                    deliberately not narrowed) versus USING THE SCOPE AS ITS
#                    COVERAGE DENOMINATOR ONLY (player-stats feeds the
#                    watchlist to acc.expect and publishes every row the feed
#                    returns). Both are true narrowing; only the first changes
#                    the signal set a consumer receives. Read the collector's
#                    own module docstring before assuming which it is.
#   depends_on       other collectors in THIS file. Self-dependency and cycles
#                    are rejected.

collectors:
  - name: weather
    path: /collectors/weather
    stage: 8A
    cadence_class: volatile
    envelope_version: "1"
    signal_types: [venue_forecast_kickoff, venue_conditions_current]
    scope_aware: false
    # Empty deliberately. The phase doc's "Depends on" line for weather names
    # a bundled in-process schedule adapter (not a collector) and `venue`.
    # `venue` IS registered now (8E), but weather does not read it: the field
    # it wants is `field_orientation_deg`, which `venue` ships null because no
    # source for it has been found, so `crosswind_component_mph` stays null and
    # there is no runtime edge to declare. Add the edge in the PR that wires
    # the read, not before — a dependency nothing exercises is a wrong edge in
    # a graph two machines read.
    depends_on: []

  - name: player-identity
    path: /collectors/player-identity
    stage: 8A
    cadence_class: seasonal
    envelope_version: "1"
    signal_types: [player_identity_crosswalk, name_resolution_miss]
    # It must resolve names the scope deliberately excludes — deep bench
    # players and free agents that betting books and news feeds mention.
    scope_aware: false
    # Foundational, and the only entry that can be. Every other collector
    # emits a player_id, and this is the collector that decides what one is.
    depends_on: []

  - name: roster-scope
    path: /collectors/roster-scope
    stage: 8A
    cadence_class: weekly
    envelope_version: "1"
    signal_types: [scope_membership_weekly, scope_change_event, scope_matchup_weekly]
    # It defines the scope rather than consuming it.
    scope_aware: false
    # A real runtime call, not a conceptual dependency: `helm/values/
    # roster-scope/values.yaml` sets `PLAYER_IDENTITY_URL` to
    # `http://player-identity:8002`, so `build_resolver` selects
    # `HttpPlayerIdentityResolver` and every capture pass resolves names over
    # HTTP against the real service (~992 calls per pass, confirmed against
    # a live container run) rather than the in-process stub. Declared here
    # because the seam exists and the phase doc names the dependency — and
    # because this is the merge-order gate that kept this PR behind
    # player-identity's, which is the gate working as designed.
    depends_on: [player-identity]

  - name: injury-report
    path: /collectors/injury-report
    stage: 8B
    cadence_class: volatile
    envelope_version: "1"
    signal_types: [player_injury_status, team_injury_report]
    # TRUE, but on the UNION, not the membership list alone. An opposing
    # cornerback ruled out moves a receiver's projection as much as the
    # receiver's own hamstring does, and defenders never appear on the
    # offence-oriented membership list at all — that observation used to be
    # read as an argument for staying unnarrowed. It is actually the reason
    # this collector also reads `scope_matchup_weekly`: `roster-scope`
    # publishes a separately-bounded ~608-slot CB/S/LB/DL/OL universe for
    # exactly this case, and `ScopeClient.fetch_union` turns the two lists
    # into the one set this collector needs. See
    # `injury_report/adapters/scope.py`.
    #
    # Honest limitation: the narrowing runs, but it currently publishes ZERO
    # `player_injury_status` rows against a real `roster-scope`, because this
    # collector's `resolve_player_id` mints `fdy-<sha256(...)>` stub ids and
    # raises rather than resolving once `PLAYER_IDENTITY_URL` is set — its
    # HTTP resolver was never built — while `roster-scope` mints
    # `fdy-<sha1(...)>` ids. The two id spaces cannot intersect, so every row
    # is dropped and the pass emits a loud `scope_dropped_everything` error
    # plus counter rather than a silent empty success. Checked structurally
    # (imports the narrowing seam) by tests/test_scope_aware_gate.py; that a
    # capture actually narrows and fails closed is
    # services/injury-report/tests/. Building the crosswalk so a row can
    # actually survive the join is a known follow-up, tracked separately from
    # this flag.
    scope_aware: true
    # `player-identity` because every emitted row carries a canonical
    # player_id and that collector is what decides what one is (the seam is
    # `injury_report/adapters/identity.py`; PLAYER_IDENTITY_URL ships empty and
    # ids are minted deterministically until it does not).
    #
    # `roster-scope` because the whole capture now fails CLOSED unless it
    # published BOTH scope signal types for the week (or the prior one) —
    # stronger than `usage-share`'s or `player-stats`', which fail closed on
    # membership alone and already declare both. This edge was missing while
    # the narrowing was being built, which made it a wrong edge in a graph two
    # machines read: `tests/test_collector_registry.py`'s merge-order gate and
    # the out-of-repo generator.
    depends_on: [player-identity, roster-scope]
  - name: usage-share
    path: /collectors/usage-share
    stage: 8B
    cadence_class: weekly
    envelope_version: "1"
    signal_types: [player_usage_weekly]
    # TRUE. Narrows forward, not backward: the scope is a set of canonical
    # `fdy-` ids and the feed is keyed by GSIS id, so every upstream row's
    # `gsis_id` is resolved to an `fdy-` id via `IdentityClient` and checked
    # against `roster-scope`'s membership list. `gsis` is a published
    # crosswalk source, so `player-identity` adopts the link at Tier 1 with no
    # attribute scoring at all. See `usage_share/adapters/scope.py`.
    #
    # This replaces an earlier claim that narrowing was "impossible" because
    # the scope's rows carry no name or external id to join a GSIS-keyed feed
    # onto — that predated `collector_core.identity` and assumed the only
    # possible join ran in the reverse direction (scope -> GSIS). It does not;
    # the forward direction needs nothing from the scope but the `fdy-` id set
    # it already publishes. Checked structurally (imports the narrowing seam)
    # by tests/test_scope_aware_gate.py; that a capture actually narrows and
    # fails closed is services/usage-share/tests/.
    scope_aware: true
    depends_on: [player-identity, roster-scope]
  - name: roster-transactions
    path: /collectors/roster-transactions
    stage: 8B
    cadence_class: volatile
    envelope_version: "1"
    signal_types: [roster_transaction]
    # Checked structurally by tests/test_scope_aware_gate.py; nothing verifies
    # the reasoning below. False deliberately, and for a reason specific to
    # this collector: the players who matter most here are the ones NOT yet on
    # the watchlist, since the transaction is the thing that puts them there.
    # Narrowing to roster-scope's membership before fetching would filter out
    # exactly the signal.
    scope_aware: false
    # Conceptual today, not yet a runtime call: the canonical `player_id` on
    # every row comes from player-identity, but nothing here reaches it over
    # HTTP — the adapter passes the upstream's id through and the crosswalk is
    # applied downstream. Declared anyway because the phase doc names the
    # dependency, and because this is the merge-order gate that keeps this PR
    # behind player-identity's.
    depends_on: [player-identity]
  - name: player-stats
    path: /collectors/player-stats
    stage: 8B
    cadence_class: weekly
    envelope_version: "1"
    signal_types: [player_box_weekly]
    # Checked structurally by tests/test_scope_aware_gate.py; nothing verifies
    # the reasoning below. True because the collector's coverage.expected is
    # defined against roster-scope's watchlist and its EXPECTED_FLOOR is
    # derived from roster-scope's config (416 slots minus the 32 team
    # defenses, which have no box score = 384).
    # The watchlist itself is read from the lake unconditionally — there is no
    # env var that turns narrowing off. See
    # services/player-stats/player_stats/adapters/scope.py.
    scope_aware: true
    # roster-scope for the watchlist (read from the lake, never over HTTP —
    # decision 5 of the narrowing design), player-identity for the GSIS ->
    # canonical id crosswalk. Declared because the phase doc names them and
    # this is the merge-order gate that keeps this PR behind both of theirs.
    depends_on: [player-identity, roster-scope]
  - name: schedule-context
    path: /collectors/schedule-context
    stage: 8B
    cadence_class: weekly
    envelope_version: "1"
    signal_types: [game_situational_context, team_rest_context]
    # Checked structurally by tests/test_scope_aware_gate.py; nothing verifies
    # the reasoning below. False here because the signals are keyed by game
    # and team; there is no player in them for roster-scope's membership list
    # to narrow.
    scope_aware: false
    # Empty deliberately, and now for a different reason than it used to be.
    # The phase doc's "Depends on" line says "nothing directly; joins to
    # `venue` for coordinates and timezones". `venue` IS registered now (8E),
    # but this collector still does not call it: the join is served by an
    # in-process table (schedule_context/venues.py) behind a `Venue` seam, the
    # same shape as weather's bundled schedule adapter. Rewiring that seam onto
    # `venue` adds a service to the path, a fail-closed decision for a `venue`
    # outage, and this edge — it is a follow-up with its own review, and the
    # edge lands in the PR that wires the call. Declaring it now would be a
    # wrong edge in a graph the merge-order gate and the out-of-repo generator
    # both read.
    depends_on: []
  - name: depth-chart
    path: /collectors/depth-chart
    stage: 8B
    cadence_class: volatile
    envelope_version: "1"
    signal_types: [team_depth_chart, depth_chart_stability]
    # Checked structurally by tests/test_scope_aware_gate.py; nothing verifies
    # the reasoning below. False deliberately, and the spec gives the reason:
    # the chart is a team-level structure, and ranking only watchlist players
    # would hide the backup who is one move away from entering it. Every
    # charted player at the configured positions is published, however deep.
    scope_aware: false
    # NOT roster-scope, and the direction is the point: roster-scope CONSUMES a
    # depth chart to decide who is in scope, while this collector PUBLISHES the
    # chart itself. Naming it here would invert the arrow and would set up a
    # cycle the moment roster-scope declared this collector — which is the
    # follow-up worth doing, since roster-scope currently reads the same feed
    # through its own adapter.
    #
    # player-identity is declared for the reason roster-scope declares it: the
    # `player_id` field on `team_depth_chart` has no other possible source. It
    # is conceptual today rather than a runtime call — the field ships null and
    # the published `gsis_id` crosswalk key is carried instead, because a
    # player-identity client is something the whole fleet needs and belongs in
    # collector-core rather than as a third per-service copy.
    #
    # The spec also names `roster-transactions` (for mid-week invalidation).
    # It is not in this file, so it cannot be listed: depends_on names
    # REGISTERED collectors, and the gate rejects an unregistered one. Add it
    # here when that collector merges.
    depends_on: [player-identity]

  - name: venue
    path: /collectors/venue
    stage: 8E
    cadence_class: static reference
    envelope_version: "1"
    signal_types: [venue_static, venue_game_assignment]
    # Checked structurally by tests/test_scope_aware_gate.py; nothing verifies
    # the reasoning below. False, and for this collector it is not a judgement
    # call: the spec's own line is "no — venues are not players". Neither
    # signal type carries a player_id at all. `venue_static` is keyed by
    # building and `venue_game_assignment` by game, so roster-scope's
    # membership list has nothing here to narrow — and narrowing the SEASON's
    # venues to anything smaller would break the coverage rule, which is
    # defined as every venue hosting at least one game.
    scope_aware: false
    # Empty, and the spec says so outright ("Depends on: nothing"). Worth one
    # line because two edges look like they belong here and do not:
    #
    #   schedule-context — reads venue coordinates, so the arrow points the
    #     other way; it would be its entry declaring this one, once its
    #     in-process venues.py is rewired (a follow-up).
    #   player-identity — every OTHER collector declares it because it decides
    #     what a player_id is. This one emits none.
    #
    # The nflverse game table this collector reads for assignments is a third
    # party, not a collector, so it is not a depends_on either.
    depends_on: []

  - name: durability-history
    path: /collectors/durability-history
    stage: 8E
    cadence_class: seasonal
    envelope_version: "1"
    signal_types: [player_durability_profile, player_injury_history, player_return_trajectory]
    # Set true if this collector narrows to roster-scope's membership list
    # before it fetches. Checked structurally by
    # tests/test_scope_aware_gate.py: declaring true requires importing
    # collector_core.scope.ScopeClient (`from collector_core.scope import
    # ScopeClient`) somewhere in this collector's source — that test is by
    # AST, so an `import collector_core.scope` plus attribute access will
    # not satisfy it. That check proves the narrowing seam is wired in, not
    # that it behaves correctly; write this collector's own fail-closed test
    # for that.
    scope_aware: true
    depends_on: [player-identity, roster-scope, injury-report]
